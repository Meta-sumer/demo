# Security headers for the web client, the admin console and the download
# page (copied to /etc/nginx/snippets/ by deploy.sh on every deploy).
#
# Include it in every location that serves those pages, next to (after) any
# add_header of the location: nginx drops the headers of an outer level as
# soon as a location has an add_header of its own. The API (/api/, /ws,
# /webhooks/) sends its own headers from the Go server and must not include
# this file.
#
# Content-Security-Policy, checked against the production builds of client/
# and admin/ (npm run build): no inline script (the theme script is the file
# /theme-init.js), no eval, no external script. External origins in use:
# Google Fonts (stylesheet fonts.googleapis.com, font files
# fonts.gstatic.com). Images are same-origin, data: URIs or blob: URLs
# (local previews of uploaded proofs). The API and websocket are same-origin (/api, wss://host/ws).
# Links to tronscan.org, bscscan.com, BeeX and tradingview.com are plain
# navigation, which the policy does not restrict.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' wss://$host; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
