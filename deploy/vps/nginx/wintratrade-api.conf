# Shared by the client and admin sites: the API and the websocket.
# Copied to /etc/nginx/snippets/ by deploy.sh on every deploy (the site file
# itself is managed by certbot and never overwritten).

# Deposit screenshots are up to 5 MiB, plus the multipart envelope.
client_max_body_size 8m;

location /api/ {
    proxy_pass http://bt_api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite, never append: the server's rate limiter reads the first
    # X-Forwarded-For value, so a client must not be able to supply it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# BeeX payment webhooks (USDT deposits and payouts). Register
# https://wintratrade.online/webhooks/beex/crypto at BeeX. The API verifies
# the X-Signature HMAC over the exact body, so it is passed through untouched;
# only POST, and small: the API itself refuses bodies over 64 KiB.
location = /webhooks/beex/crypto {
    limit_except POST { deny all; }
    client_max_body_size 64k;
    proxy_pass http://bt_api/webhooks/beex/crypto;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering on;
    proxy_read_timeout 30s;
}

location = /ws {
    # The access token travels in the query string (?token=...): log the
    # path only (log_format wt_noquery, wintratrade-logformat.conf). nginx
    # error lines quote the whole request line, so this location logs only
    # critical errors; an unreachable API shows up on /api/ and in /ready.
    access_log /var/log/nginx/access.log wt_noquery;
    error_log /var/log/nginx/error.log crit;
    proxy_pass http://bt_api/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# The Android app and its download page. Kept outside the client build
# directory, which every deploy replaces.
location = /download {
    return 301 /download/;
}
location = /download/binary-trading.apk {
    alias /var/www/wintratrade/downloads/binary-trading.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="binary-trading.apk"';
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/wintratrade-security-headers.conf;
}
location /download/ {
    alias /var/www/wintratrade/downloads/;
    index index.html;
    include /etc/nginx/snippets/wintratrade-security-headers.conf;
}
