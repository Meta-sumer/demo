# Access-log format without the query string (copied to /etc/nginx/conf.d/ by
# deploy.sh; http context). Used for /ws, whose URL carries the customer's
# access token (?token=...): the default "combined" format logs $request,
# which includes it. $uri is the path only.
log_format wt_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
