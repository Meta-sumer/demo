# wintratrade.online - trading client, admin console and the API behind both.
#
# Each site serves its own static build and proxies /api and /ws to the Go
# server on 127.0.0.1:4000, so the browser only ever talks to one origin.
# certbot --nginx adds the 443 blocks and the HTTP->HTTPS redirects to this file.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream bt_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name wintratrade.online www.wintratrade.online;

    root /var/www/wintratrade/client;
    index index.html;

    include /etc/nginx/snippets/wintratrade-api.conf;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.wintratrade.online;

    root /var/www/wintratrade/admin;
    index index.html;

    include /etc/nginx/snippets/wintratrade-api.conf;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
