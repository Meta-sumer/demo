# Production overrides for a single server (for example a VPS).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile full up -d --build
#
# Three differences from the development file:
#
# - MongoDB and Redis publish no ports. Docker writes its own firewall rules,
#   so a published port is reachable from the internet even when ufw says it
#   is closed. Only the API container talks to them, over Compose's network.
# - The replica set advertises its member as `mongo:<port>`, the name other
#   containers reach it by. The development file advertises `localhost`, which
#   from inside the API container would point at the API container itself.
# - The API listens on 127.0.0.1 only; Nginx on the host is its front door.
services:
  mongo:
    ports: !reset []
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--port",
          "${MONGO_PORT:-27017}",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:${MONGO_PORT:-27017}'}]}).ok }",
        ]

  redis:
    ports: !reset []

  server:
    ports: !override
      - "127.0.0.1:4000:4000"
    environment:
      # Nginx on the host reaches the API through Docker's bridge, so the peer
      # the API sees is the bridge gateway (172.16.0.0/12), not 127.0.0.1.
      # Without this every customer would share one address for rate limits.
      # Safe because the port above is bound to 127.0.0.1: only the host
      # (Nginx) can connect, and Nginx overwrites X-Forwarded-For.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
