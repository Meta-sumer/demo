# Builds the Android APK of the mobile app on GitHub's runners and publishes
# it as a GitHub release, without EAS cloud builds.
#
# Run it by hand: Actions -> "Android APK" -> Run workflow.
#
# It signs with the same keystore EAS used, so the APK installs as an update
# over the previous version. The keystore and its passwords come from these
# repository secrets (Settings -> Secrets and variables -> Actions):
#
#   ANDROID_KEYSTORE_BASE64    the .jks file from `eas credentials`, base64
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
#
# versionCode must be higher than the one in the APK people already have
# (1.0.3 was 4). The app version (1.0.4) comes from mobile/app.json.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android versionCode (higher than the installed app's)
        required: true
        default: "5"

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_PUBLIC_API_URL: https://wintratrade.online/api
      EXPO_PUBLIC_WS_URL: wss://wintratrade.online/ws
      VERSION_CODE: ${{ inputs.version_code }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Check the signing secrets are set
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS" ]  || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KSP" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KA" ]  || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KP" ]  || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::missing repository secrets:$missing"; exit 1; fi
          case "$VERSION_CODE" in ''|*[!0-9]*) echo "::error::version_code must be a whole number"; exit 1;; esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        # mobile/.npmrc sets workspaces=false, so this uses mobile/package-lock.json only.
        run: npm ci

      - name: Set the versionCode
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.android = { ...app.expo.android, versionCode: Number(process.env.VERSION_CODE) };
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
            console.log("version", app.expo.version, "versionCode", app.expo.android.versionCode);
          '

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Install the release keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          # A second android {} block is merged by Gradle: release builds are
          # signed with the EAS keystore instead of the debug key prebuild sets.
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  wintratradeRelease {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.wintratradeRelease
                  }
              }
          }
          GRADLE

      - name: Build the APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify the signature
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$apk"
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$tools/apksigner" verify --print-certs "$apk" | head -5
          version=$(node -p 'require("./app.json").expo.version')
          cp "$apk" "$RUNNER_TEMP/binary-trading-$version.apk"
          echo "APK_VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-trading-${{ env.APK_VERSION }}-${{ inputs.version_code }}
          path: ${{ runner.temp }}/binary-trading-${{ env.APK_VERSION }}.apk
          retention-days: 30

      - name: Publish a release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="mobile-v${APK_VERSION}-${VERSION_CODE}"
          gh release create "$tag" "$RUNNER_TEMP/binary-trading-${APK_VERSION}.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Mobile app ${APK_VERSION} (versionCode ${VERSION_CODE})" \
            --notes "Built by the Android APK workflow from ${GITHUB_SHA}. Points at https://wintratrade.online."
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/binary-trading-${APK_VERSION}.apk" >> "$GITHUB_STEP_SUMMARY"
