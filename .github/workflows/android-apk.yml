# Builds the Android APK of the mobile app on GitHub's runner and publishes
# it as a GitHub release.
#
# It runs `eas build --local`: EAS prepares the build (the preview profile's
# environment, the remote versionCode, the same signing keystore EAS has
# always used, so the APK installs as an update) but the build itself runs
# here, so it does not use the EAS cloud build quota.
#
# One repository secret is needed (Settings -> Secrets and variables ->
# Actions): EXPO_TOKEN, an access token of the Expo account that owns the
# project (expo.dev -> Account settings -> Access tokens).
#
# Run it by hand: Actions -> "Android APK" -> Run workflow.
name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_CLI: eas-cli@24.13.0
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Check the Expo token is set
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::add the EXPO_TOKEN repository secret (expo.dev -> Account settings -> Access tokens)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        # mobile/.npmrc sets workspaces=false, so this uses mobile/package-lock.json only.
        run: npm ci

      - name: Check the Expo account
        run: npx --yes "$EAS_CLI" whoami

      - name: Build the APK on this runner
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false
        run: |
          npx --yes "$EAS_CLI" build --platform android --profile preview --local \
            --non-interactive --output "$RUNNER_TEMP/app-release.apk"

      - name: Verify the APK
        run: |
          apk="$RUNNER_TEMP/app-release.apk"
          ls -l "$apk"
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$tools/apksigner" verify --print-certs "$apk" | head -5
          badging="$("$tools/aapt" dump badging "$apk" | head -1)"
          echo "$badging"
          version=$(echo "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          code=$(echo "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          cp "$apk" "$RUNNER_TEMP/binary-trading-$version.apk"
          echo "APK_VERSION=$version" >> "$GITHUB_ENV"
          echo "APK_CODE=$code" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-trading-${{ env.APK_VERSION }}-${{ env.APK_CODE }}
          path: ${{ runner.temp }}/binary-trading-${{ env.APK_VERSION }}.apk
          retention-days: 30

      - name: Publish a release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="mobile-v${APK_VERSION}-${APK_CODE}"
          gh release create "$tag" "$RUNNER_TEMP/binary-trading-${APK_VERSION}.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Mobile app ${APK_VERSION} (versionCode ${APK_CODE})" \
            --notes "Built by the Android APK workflow (eas build --local) from ${GITHUB_SHA}. Points at https://wintratrade.online."
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/binary-trading-${APK_VERSION}.apk" >> "$GITHUB_STEP_SUMMARY"
